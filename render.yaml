# Render Blueprint — https://render.com/docs/infrastructure-as-code
# Production web service: real integrations only. Render injects RENDER=true; see Settings._render_host_production_defaults.
# Docker path defaults to ./Dockerfile from repo root; dockerContext is . so COPY apps/backend/... works.
# After deploy: set PUBLIC_BASE_URL to https://<service-name>.onrender.com and add secrets in Environment.
# REDIS_URL: same container runs uvicorn + arq reminder worker when set (managed Redis required in production).
version: "1"
services:
  - type: web
    name: medbuddy-api
    runtime: docker
    plan: free
    region: singapore
    # Repo-root Dockerfile (Render’s default path). Context must be repo root for COPY apps/backend/...
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MEDBUDDY_INTEGRATION
        value: real
      - key: MOCK_EXTERNAL_SERVICES
        value: "false"
      - key: DEBUG
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: MEDBUDDY_LOCALE
        value: zh-TW
      # Set after first deploy (your service HTTPS URL, no trailing slash).
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: WHISPER_SERVICE_URL
        sync: false
      - key: MEDBUDDY_MOBILE_BEARER_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MEDBUDDY_CRON_SECRET
        sync: false
