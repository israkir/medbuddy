# Render Blueprint — https://render.com/docs/infrastructure-as-code
# Production web service: production integrations only.
# Docker path defaults to ./Dockerfile from repo root; dockerContext is . so COPY apps/backend/... works.
# After deploy: set PUBLIC_BASE_URL to https://<service-name>.onrender.com and add secrets in Environment.
# REDIS_URL: same container runs uvicorn + arq reminder worker when set (managed Redis required in production).
version: "1"
services:
  - type: web
    name: medbuddy-api
    runtime: docker
    plan: free
    region: singapore
    # Repo-root Dockerfile (Render's default path). Context must be repo root for COPY apps/backend/...
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MEDBUDDY_INTEGRATION
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: MEDBUDDY_LOCALE
        value: zh-TW
      # Set after first deploy (your service HTTPS URL, no trailing slash).
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Google Cloud Speech-to-Text: set in Render dashboard (Secret where needed).
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: GOOGLE_SPEECH_PROJECT_ID
        sync: false
      - key: GOOGLE_SPEECH_LOCATION
        value: global
      - key: MEDBUDDY_MOBILE_BEARER_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MEDBUDDY_CRON_SECRET
        sync: false
