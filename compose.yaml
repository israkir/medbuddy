# Podman Compose: `podman compose up --build` (from repository root)
# Reminders + Redis: `REDIS_URL=redis://redis:6379 podman compose --profile reminders up --build`
# (`medbuddy-api` runs uvicorn + arq when REDIS_URL is set.)
services:
  medbuddy-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # mock | production — production needs LINE_CHANNEL_ACCESS_TOKEN, etc. (see apps/backend/.env.example)
      MEDBUDDY_INTEGRATION: "${MEDBUDDY_INTEGRATION:-mock}"
      MOCK_EXTERNAL_SERVICES: "${MOCK_EXTERNAL_SERVICES:-true}"
      PUBLIC_BASE_URL: "http://localhost:8000"
      LINE_CHANNEL_SECRET: ""
      LINE_CHANNEL_ACCESS_TOKEN: ""
      REDIS_URL: "${REDIS_URL:-}"

  redis:
    image: docker.io/library/redis:7-alpine
    profiles: ["reminders"]
    ports:
      - "6379:6379"
