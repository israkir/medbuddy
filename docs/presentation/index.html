# Regional cloud &amp; compliance

.cols[
.col[
### AWS region per market

| Market | Region | Key reason |
|---|---|---|
| Taiwan (Pilot) | `ap-east-1` HK | &lt;20 ms; GCP TW DC also viable |
| **Japan (Growth)** | **`ap-northeast-1` Tokyo** | LINE Corp runs here; enterprise procurement aligned |
| Korea | `ap-northeast-2` Seoul | PIPA requires KR data residency; KakaoTalk adapter |
| Thailand · Indonesia | `ap-southeast-1` Singapore | Regional hub; local DC when regulation requires |
| Global | `us-east-1` + APAC + EU | HA; compliance-driven region selection |

**Why AWS:** RDS, DynamoDB, SQS, ElastiCache map directly to our stack — no re-architecture at any phase.
]
.col[
### Data sovereignty obligations

| Market | Law | Key requirement |
|---|---|---|
| **Taiwan** | PDPA 2023 | Explicit consent; data accessible to TW regulators |
| **Japan** | APPI 2022 | Explicit consent; de-identify before cross-border LLM calls |
| **Korea** | PIPA | Data must stay in KR; no offshore transfer |
| **TH · ID** | PDPA TH / GR 71 | In-country or explicit cross-border consent |
| **EU** | GDPR Art. 9 | Health = special category; DPA + DPIA required |
]
]

<div class="callout"><p><strong>All of this is adapter-layer work.</strong> The assistant core never changes for a new market — only the channel (LINE → Kakao → WhatsApp), the locale pack, and the regional drug-data source.</p></div>

    // URL ?mode= parameter. The mode-bar buttons just navigate to a URL with the
    // right ?mode= parameter, which reloads the page. This avoids the rebuild
    // bugs that come with calling remark.create() twice on the same DOM.
    var sourceEl = document.getElementById('source');
    var urlMode  = /[?&]mode=vc\b/.test(location.search) ? 'vc' : 'full';

    function buildCompactSource(src) {
      // Split into slides on '\n---\n' boundaries (remark default).
      var parts = src.split(/\n---\n/);
      var kept = parts.filter(function (slide) {
        // Drop slides whose first non-empty lines declare a `deep` class.
        // Matches `class: deep`, `class: section deep`, `class: title deep`, etc.
        var firstLines = slide.split('\n').slice(0, 8).join('\n');
        return !/class:[^\n]*\bdeep\b/.test(firstLines);
      });
      return kept.join('\n---\n');
    }

    // Compute the source remark will render. In VC mode, drop deep slides.
    var sourceText = urlMode === 'vc'
      ? buildCompactSource(sourceEl.value)
      : sourceEl.value;

    // Keep the textarea in sync (helps "view source" and devtools), but more
    // importantly pass `source` explicitly to remark.create() — remark reads
    // the textarea synchronously at create time and some bundles cache the
    // initial DOM textContent, so writing .value alone isn't always enough.
    sourceEl.value = sourceText;

    if (!window.remark || typeof window.remark.create !== 'function') {
      var bootError = document.getElementById('boot-error');
      if (bootError) {
        bootError.textContent = 'Failed to load remark.js. Check CDN/network access or ensure ./vendor/remark-latest.min.js is present.';
        bootError.style.display = 'block';
      }
      throw new Error('remark.js did not load');
    }

    var slideshow = remark.create({
      source: sourceText,
      ratio: '16:9',
      slideNumberFormat: '%current% / %total%',
      countIncrementalSlides: false,
      highlightLanguage: 'text',
      navigation: { scroll: false, touch: true, click: false }
    });

    // Reflect mode in body class (lets CSS hide artefacts if any) and toolbar.
    document.body.classList.add('mode-' + urlMode);
    document.getElementById('mode-vc'  ).classList.toggle('active', urlMode === 'vc');
    document.getElementById('mode-full').classList.toggle('active', urlMode === 'full');

    // Mode bar — navigate to the right URL and let the reload do the work.
    function gotoMode(mode) {
      var url = new URL(location.href);
      if (mode === 'vc') url.searchParams.set('mode', 'vc');
      else               url.searchParams.delete('mode');
      // Drop hash so the new mode lands on slide 1.
      url.hash = '';
      location.assign(url.toString());
    }
    document.getElementById('mode-vc'  ).addEventListener('click', function () { gotoMode('vc');   });
    document.getElementById('mode-full').addEventListener('click', function () { gotoMode('full'); });

    // Keyboard shortcuts: V = vc, A = full. (F is left to the browser for fullscreen;
    // we still require no ctrl/meta so we do not override Cmd/Ctrl+A.)
    document.addEventListener('keydown', function (e) {
      if (e.target && /input|textarea/i.test(e.target.tagName)) return;
      if ((e.key === 'v' || e.key === 'V') && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
        gotoMode('vc');
      }
      if ((e.key === 'a' || e.key === 'A') && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
        gotoMode('full');
      }
    });

    // ---- Mermaid + Chart.js post-render integration ----
    // Remark renders slides on the fly. We initialise Mermaid in manual mode
    // and run it across all .mermaid blocks once the DOM is settled. Chart.js
    // renders are triggered by `data-chart` attributes on canvas elements.

    if (window.mermaid) {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'base',
        securityLevel: 'loose',
        themeVariables: {
          fontFamily: 'Inter, "Noto Sans TC", system-ui, sans-serif',
          fontSize:   '14px',
          primaryColor:        '#eef4f2',
          primaryTextColor:    '#0f1f1d',
          primaryBorderColor:  '#066658',
          lineColor:           '#5a7a72',
          secondaryColor:      '#fff3ee',
          tertiaryColor:       '#ecebf6',
          clusterBkg:          '#f7fcfb',
          clusterBorder:       '#066658',
          edgeLabelBackground: '#ffffff',
          /* Base theme defaults cluster titles too light on our light clusterBkg */
          titleColor:          '#022c26'
        }
      });
    }

    function renderMermaid() {
      if (!window.mermaid) return;
      // Reset already-rendered nodes so re-runs work after slide nav.
      var nodes = document.querySelectorAll('.mermaid');
      nodes.forEach(function (n) {
        if (n.dataset.processed === 'true' && n.dataset.source) {
          n.removeAttribute('data-processed');
          n.innerHTML = n.dataset.source;
        } else if (!n.dataset.source) {
          n.dataset.source = n.textContent.trim();
        }
      });
      try { mermaid.run({ querySelector: '.mermaid' }); } catch (_) {}
    }

    // ---- Chart.js helper -----------------------------------------------
    // Each chart canvas declares its config via data-chart='{...}' (JSON).
    // We instantiate once per canvas, keyed on a `data-rendered` flag.
    function renderCharts() {
      if (!window.Chart) return;
      document.querySelectorAll('canvas[data-chart]').forEach(function (cv) {
        if (cv.dataset.rendered === 'true') return;
        try {
          var cfg = JSON.parse(cv.dataset.chart);
          new Chart(cv.getContext('2d'), cfg);
          cv.dataset.rendered = 'true';
        } catch (e) { console.warn('chart parse error', e); }
      });
    }

    function renderAll() { renderMermaid(); renderCharts(); }

    // Initial render once remark has built the DOM.
    setTimeout(renderAll, 50);

    // Re-render on slide change so visualisations also appear when revisited.
    if (slideshow && slideshow.on) {
      slideshow.on('afterShowSlide', function () { setTimeout(renderAll, 30); });
    }
  </script>
</body>
</html>
