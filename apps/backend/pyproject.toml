[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medbuddy-api"
version = "0.0.1"
description = "MedBuddy LINE webhook backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "black>=24.10.0",
  "pre-commit>=4.0.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]
voice = [
  "pydub>=0.25.1",
]
tts = [
  "edge-tts>=6.1.0",
]
llm = [
  "google-generativeai>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medbuddy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "/(\\.venv|\\.git)/"

[tool.ruff]
line-length = 100
target-version = "py311"
