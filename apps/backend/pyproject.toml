[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medbuddy-api"
version = "0.0.1"
description = "MedBuddy LINE webhook backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135.3",
  "uvicorn[standard]>=0.44.0",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.13.1",
  "httpx>=0.28.1",
  "google-cloud-speech>=2.38.0",
  "google-cloud-texttospeech>=2.36.0",
  "line-bot-sdk==3.22.0",
  "python-multipart>=0.0.24",
]

[project.optional-dependencies]
dev = [
  "black>=26.1.0",
  "pre-commit>=4.0.0",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.15.2",
  "arq>=0.27.0",
]
voice = [
  "pydub>=0.25.1",
]
tts = [
  "edge-tts>=7.2.8",
]
llm = [
  "google-genai>=1.70.0",
  "openai>=1.40.0",
]
supabase = [
  "supabase>=2.28.3",
]
reminders = [
  "arq>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medbuddy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "/(\\.venv|\\.git)/"

[tool.ruff]
line-length = 100
target-version = "py311"
